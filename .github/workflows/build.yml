name: Build DLL (x86)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install DirectX SDK
      run: choco install directx-sdk -y

    - name: Download ImGui
      run: |
        Invoke-WebRequest -Uri "https://github.com/ocornut/imgui/archive/refs/tags/v1.90.9.zip" -OutFile "imgui.zip"
        Expand-Archive -Path "imgui.zip" -DestinationPath "."
        Rename-Item -Path "imgui-1.90.9" -NewName "imgui"

    - name: Download MinHook
      run: |
        Invoke-WebRequest -Uri "https://github.com/TsudaKageyu/minhook/archive/refs/tags/v1.3.4.zip" -OutFile "minhook.zip"
        Expand-Archive -Path "minhook.zip" -DestinationPath "."
        Rename-Item -Path "minhook-1.3.4" -NewName "minhook"

    - name: Build with MSBuild
      run: msbuild dllexe.sln /p:Configuration=Release /p:Platform=Win32

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dllexe-x86
        path: Release/*.dll
        if-no-files-found: error
