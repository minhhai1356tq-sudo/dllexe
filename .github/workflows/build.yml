name: Build DLL (x86)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install DirectX SDK (June 2010)
      run: |
        choco install directx-sdk -y

    - name: Build with MSBuild
      run: msbuild dllexe.sln /p:Configuration=Release /p:Platform=Win32

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: dllexe-x86
        path: Release/*.dll
        if-no-files-found: error
